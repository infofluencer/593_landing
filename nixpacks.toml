# Dokploy / Nixpacks: Next.js 16 requires Node >= 20.9
# cache-bust: 2026-08-04-launchfolio
[variables]
NIXPACKS_NODE_VERSION = "20"
NIXPACKS_NO_CACHE = "1"

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.build]
# TypeScript adımı varsayılan heap sınırında (~190 MB) OOM oluyordu.
cmds = ["NODE_OPTIONS=--max-old-space-size=2048 npm run build"]

[start]
# migrate on boot so Dokploy redeploy applies schema without docker exec
cmd = "npm run start"
